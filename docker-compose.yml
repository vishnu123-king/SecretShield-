version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secretshield-app
    restart: unless-stopped
    ports:
      - "3000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - DATABASE_URL=postgresql://secretshield:secretshield_password@postgres:5432/secretshield
      - JWT_SECRET=super-secret-shield-jwt-key-replace-in-production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: secretshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretshield
      POSTGRES_PASSWORD: secretshield_password
      POSTGRES_DB: secretshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretshield"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
