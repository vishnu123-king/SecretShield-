services:
  - type: web
    name: secretshield
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secretshield-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: secretshield-db
    databaseName: secretshield
    user: secretshield
    plan: free
